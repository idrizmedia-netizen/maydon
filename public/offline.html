<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Internet yo'q | Maydon</title>
  <style>
    :root { --bg:#f2f5f8; --ink:#0f1b2d; --muted:#566476; --green:#1b8a4b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b131f; --ink:#e8edf3; --muted:#9aa8ba; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
           background:var(--bg); color:var(--ink);
           font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 420px; }
    svg { display:block; margin-bottom: 20px; }
    h1 { margin:0 0 8px; font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
    p { margin:0 0 20px; color: var(--muted); line-height: 1.6; }
    button { font: inherit; font-weight: 700; padding: 12px 20px; border: 0; border-radius: 6px;
             background: var(--green); color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#1B8A4B"/>
      <line x1="32" y1="0" x2="32" y2="64" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
      <circle cx="32" cy="32" r="13" fill="none" stroke="#fff" stroke-width="3"/>
      <circle cx="32" cy="32" r="4" fill="#F5C518"/>
    </svg>
    <h1>Internet yo'q</h1>
    <p>Ulanishni tekshiring va qayta urinib ko'ring. Avval ochgan sahifalaringiz internetsiz ham ochilishi mumkin.</p>
    <button type="button" onclick="location.reload()">Qayta urinish</button>
  </main>
</body>
</html>
